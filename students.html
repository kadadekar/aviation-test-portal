```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Management - Aviation Test Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #0b1f33;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .back-btn {
      background: white;
      color: #0b1f33;
      border: none;
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #0b1f33;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .add-btn {
      margin-top: 20px;
      background: #0b1f33;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .add-btn:hover {
      background: #163b5c;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #0b1f33;
      color: white;
    }

    .status-active {
      color: green;
      font-weight: bold;
    }

    .status-inactive {
      color: red;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <h1>Aviation Test Portal — Student Management</h1>

    <button class="back-btn" onclick="goDashboard()">
      ← Dashboard
    </button>

  </div>


  <div class="container">

    <!-- ADD STUDENT -->

    <div class="card">

      <h2>Add Student</h2>

      <form id="studentForm">

        <div class="form-grid">

          <div class="form-group">
            <label>Username *</label>

            <input
              type="text"
              id="username"
              required
              placeholder="Student username"
            >
          </div>


          <div class="form-group">

            <label>Password *</label>

            <input
              type="password"
              id="password"
              required
              placeholder="Student password"
            >

          </div>


          <div class="form-group">

            <label>Full Name *</label>

            <input
              type="text"
              id="fullName"
              required
              placeholder="Student full name"
            >

          </div>


          <div class="form-group">

            <label>Roll No.</label>

            <input
              type="text"
              id="rollNo"
              placeholder="Roll number"
            >

          </div>


          <div class="form-group">

            <label>Batch</label>

            <input
              type="text"
              id="batch"
              placeholder="Batch"
            >

          </div>


          <div class="form-group">

            <label>Email</label>

            <input
              type="email"
              id="email"
              placeholder="Student email"
            >

          </div>

        </div>


        <button
          type="submit"
          class="add-btn"
        >
          Add Student
        </button>


        <div id="message"></div>

      </form>

    </div>


    <!-- STUDENT LIST -->

    <div class="card">

      <h2>Student List</h2>

      <div class="table-container">

        <table>

          <thead>

            <tr>
              <th>Username</th>
              <th>Name</th>
              <th>Roll No.</th>
              <th>Batch</th>
              <th>Email</th>
              <th>Status</th>
            </tr>

          </thead>


          <tbody id="studentTableBody">

            <tr>

              <td colspan="6">
                Loading students...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


<script>

const API_URL =
  "https://aviation-test-api.govapi838.workers.dev";


// ===============================
// CHECK LOGIN
// ===============================

async function checkLogin() {

  const token =
    localStorage.getItem("instructorToken");

  if (!token) {

    window.location.href =
      "instructor.html";

    return false;
  }


  try {

    const response =
      await fetch(
        API_URL + "/api/me",
        {
          headers: {
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      data.status !== "success"
    ) {

      localStorage.removeItem(
        "instructorToken"
      );

      localStorage.removeItem(
        "instructorUser"
      );

      window.location.href =
        "instructor.html";

      return false;
    }


    if (data.user.role !== "instructor") {

      alert(
        "Instructor access required."
      );

      window.location.href =
        "instructor.html";

      return false;
    }


    return true;


  } catch (error) {

    alert(
      "Unable to connect to server."
    );

    return false;
  }
}


// ===============================
// LOAD STUDENTS
// ===============================

async function loadStudents() {

  const token =
    localStorage.getItem("instructorToken");


  try {

    const response =
      await fetch(
        API_URL + "/api/students",
        {
          method: "GET",

          headers: {
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const data =
      await response.json();


    const tableBody =
      document.getElementById(
        "studentTableBody"
      );


    if (
      !response.ok ||
      data.status !== "success"
    ) {

      tableBody.innerHTML =
        `<tr>
          <td colspan="6">
            ${data.message || "Failed to load students"}
          </td>
        </tr>`;

      return;
    }


    if (!data.students.length) {

      tableBody.innerHTML =
        `<tr>
          <td colspan="6">
            No students added yet.
          </td>
        </tr>`;

      return;
    }


    tableBody.innerHTML = "";


    data.students.forEach(student => {

      const row =
        document.createElement("tr");


      const status =
        Number(student.active) === 1
          ? `<span class="status-active">Active</span>`
          : `<span class="status-inactive">Inactive</span>`;


      row.innerHTML = `
        <td>${escapeHTML(student.username || "")}</td>
        <td>${escapeHTML(student.full_name || "")}</td>
        <td>${escapeHTML(student.roll_no || "")}</td>
        <td>${escapeHTML(student.batch || "")}</td>
        <td>${escapeHTML(student.email || "")}</td>
        <td>${status}</td>
      `;


      tableBody.appendChild(row);

    });


  } catch (error) {

    document.getElementById(
      "studentTableBody"
    ).innerHTML =
      `<tr>
        <td colspan="6">
          Unable to connect to server.
        </td>
      </tr>`;

  }
}


// ===============================
// ADD STUDENT
// ===============================

document
  .getElementById("studentForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const token =
        localStorage.getItem(
          "instructorToken"
        );


      const message =
        document.getElementById(
          "message"
        );


      message.textContent =
        "Adding student...";


      message.style.color =
        "#333";


      const studentData = {

        username:
          document
            .getElementById("username")
            .value
            .trim(),

        password:
          document
            .getElementById("password")
            .value,

        fullName:
          document
            .getElementById("fullName")
            .value
            .trim(),

        rollNo:
          document
            .getElementById("rollNo")
            .value
            .trim(),

        batch:
          document
            .getElementById("batch")
            .value
            .trim(),

        email:
          document
            .getElementById("email")
            .value
            .trim()

      };


      try {

        const response =
          await fetch(
            API_URL + "/api/students",
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " + token

              },

              body:
                JSON.stringify(
                  studentData
                )

            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          data.status !== "success"
        ) {

          message.textContent =
            data.message ||
            "Failed to add student";


          message.style.color =
            "red";


          return;
        }


        message.textContent =
          "Student added successfully.";


        message.style.color =
          "green";


        document
          .getElementById(
            "studentForm"
          )
          .reset();


        await loadStudents();


      } catch (error) {

        message.textContent =
          "Unable to connect to server.";


        message.style.color =
          "red";

      }

    }
  );


// ===============================
// ESCAPE HTML
// ===============================

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


// ===============================
// DASHBOARD
// ===============================

function goDashboard() {

  window.location.href =
    "instructor-dashboard.html";

}


// ===============================
// START
// ===============================

(async function() {

  const loggedIn =
    await checkLogin();


  if (loggedIn) {

    await loadStudents();

  }

})();

</script>

</body>
</html>
