<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Login - Aviation Test Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #17324d;
    }

    h2 {
      text-align: center;
      font-size: 18px;
      font-weight: normal;
      color: #667085;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #344054;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .error {
      display: block !important;
      background: #fef3f2;
      color: #b42318;
    }

    .success {
      display: block !important;
      background: #ecfdf3;
      color: #027a48;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <h1>Aviation Test Portal</h1>

    <h2>Instructor Login</h2>

    <form id="loginForm">

      <label for="username">Username</label>

      <input
        id="username"
        type="text"
        autocomplete="username"
        placeholder="Enter username"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter password"
        required
      >

      <button id="loginButton" type="submit">
        LOGIN
      </button>

    </form>

    <div id="message"></div>

  </div>

<script>

const API_URL =
  "https://aviation-test-api.govapi838.workers.dev";

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  message.className = "";
  message.textContent = "";

  if (!username || !password) {
    message.textContent =
      "Please enter username and password.";
    message.className = "error";
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "LOGGING IN...";

  try {

    const response = await fetch(
      `${API_URL}/api/login`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username,
          password
        })
      }
    );

    const data = await response.json();

    if (!response.ok || data.status !== "success") {
      throw new Error(
        data.message || "Login failed."
      );
    }

    localStorage.setItem(
      "instructorToken",
      data.token
    );

    localStorage.setItem(
      "instructorUser",
      JSON.stringify(data.user)
    );

    message.textContent =
      "Login successful. Opening dashboard...";

    message.className = "success";

    setTimeout(function() {
      window.location.href =
        "instructor-dashboard.html";
    }, 500);

  } catch (error) {

    console.error(error);

    message.textContent =
      error.message || "Unable to login.";

    message.className = "error";

    loginButton.disabled = false;
    loginButton.textContent = "LOGIN";
  }

});

</script>

</body>
</html>
